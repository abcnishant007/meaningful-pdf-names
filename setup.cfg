[metadata]
name = meaningful-pdf-names
version = 0.1.0
description = Offline-friendly PDF renamer that generates meaningful, keyword-rich filenames from first-page content.
long_description = file: README.md
long_description_content_type = text/markdown
author = Your Name
license = MIT
license_files = LICENSE
url = https://github.com/yourname/meaningful-pdf-names
project_urls =
    Source = https://github.com/yourname/meaningful-pdf-names
    Issues = https://github.com/yourname/meaningful-pdf-names/issues
classifiers =
    Programming Language :: Python :: 3
    License :: OSI Approved :: MIT License
    Operating System :: OS Independent
    Topic :: Utilities
    Topic :: Text Processing :: Linguistic

[options]
packages = find:
python_requires = >=3.9
install_requires =
    pypdf>=5.0.0

[options.extras_require]
summarizer =
    transformers>=4.45.0
    torch>=2.0.0
    # accelerate>=0.27.0

[options.entry_points]
console_scripts =
    meaningful-pdf-names = meaningful_pdf_names.cli:main
    mpn = meaningful_pdf_names.cli:main
